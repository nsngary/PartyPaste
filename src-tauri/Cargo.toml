[package]
name = "partypaste"
version = "0.1.0"
description = "A local-first desktop phrase overlay"
authors = ["PartyPaste Contributors"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "partypaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.5"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2.11"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-global-shortcut = "2.3"
thiserror = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
