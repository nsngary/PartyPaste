[package]
name = "partypaste"
version = "0.1.0"
description = "A local-first desktop phrase overlay"
authors = ["PartyPaste Contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "partypaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.5"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11"
thiserror = "2"
